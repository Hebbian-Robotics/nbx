name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Skills frontmatter lint
        run: cargo test --test skills_lint
      - run: cargo test --workspace --all-features

  netbox-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tests only the current pin's NetBox release. Cross-minor coverage
        # is best-effort per the runtime version probe in `src/client.rs`,
        # so running the strict integration suite (which jq-asserts response
        # shapes) against a server outside `major.minor` produces noise
        # rather than signal — the probe's own stderr warning pollutes the
        # captured-stderr tests, and shape divergence between minors trips
        # the drift audit. The `Schema drift` workflow watches upstream
        # 4.x.y separately. Add patch entries (e.g. v4.6.1) within the
        # pinned major.minor when they're available on Docker Hub.
        netbox-version:
          - v4.6.0
    env:
      NETBOX_VERSION: ${{ matrix.netbox-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: tests/integration/run.sh

  # Verifies the v0.1 plan's "install on a clean machine" check: confirms
  # `cargo install --path . --locked` produces a self-contained binary that
  # runs from outside the source tree (no missing transitive deps, no path
  # assumptions baked into the binary).
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked
      - name: Run the installed binary from /tmp
        run: |
          cd /tmp
          nbx --version
          nbx --help > /dev/null
          nbx config --help > /dev/null
          nbx dcim sites create --help > /dev/null
