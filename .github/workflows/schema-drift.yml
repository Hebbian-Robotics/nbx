name: Schema drift

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-diff:
    runs-on: ubuntu-latest
    env:
      PINNED_VERSION: v4.5.10
      PINNED_SCHEMA_PATH: schema/netbox-4.5.10.json
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest NetBox 4.5.x release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag="$(
            gh api 'repos/netbox-community/netbox/releases?per_page=100' \
              --jq '[.[] | select(.tag_name | test("^v4\\.5\\.[0-9]+$"))] | first | .tag_name'
          )"
          if [[ -z "$latest_tag" || "$latest_tag" == "null" ]]; then
            echo "could not resolve latest NetBox 4.5.x release tag" >&2
            exit 1
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Diff upstream schema against pinned
        id: diff
        run: |
          set -euo pipefail
          tag="${{ steps.latest.outputs.tag }}"
          curl -fsSL \
            "https://raw.githubusercontent.com/netbox-community/netbox/${tag}/contrib/openapi.json" \
            -o /tmp/upstream-openapi.json

          if cmp -s "$PINNED_SCHEMA_PATH" /tmp/upstream-openapi.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Pinned schema matches NetBox ${tag}."
            exit 0
          fi

          echo "drift=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$tag" >> "$GITHUB_OUTPUT"

          {
            printf 'Pinned: `%s` (`%s`)\n' "$PINNED_VERSION" "$PINNED_SCHEMA_PATH"
            printf 'Upstream latest 4.5.x: `%s`\n\n' "$tag"
            printf 'OpenAPI byte diff is non-empty. To inspect locally:\n\n'
            printf '```sh\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/netbox-community/netbox/%s/contrib/openapi.json -o /tmp/upstream.json\n' "$tag"
            printf 'diff <(jq -S . %s) <(jq -S . /tmp/upstream.json) | head -200\n' "$PINNED_SCHEMA_PATH"
            printf '```\n\n'
            printf 'Bumping the pin:\n\n'
            printf '1. `mv /tmp/upstream.json schema/netbox-%s.json` (replace the version segment).\n' "${tag#v}"
            printf '2. Update `schema/README.md` (target tag, fetch URL, SHA-256).\n'
            printf '3. Update `schema/` references in `build.rs` and `xtask/codegen` if the filename changed.\n'
            printf '4. `cargo run -p nbx-codegen -- schema/netbox-%s.json src/generated/endpoints.rs` and `… types.rs`.\n' "${tag#v}"
            printf '5. Review generated diffs, run snapshots, run `tests/integration/run.sh`.\n'
          } > /tmp/issue-body.md

      - name: Open or update tracking issue
        if: steps.diff.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.diff.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          title="Schema drift: NetBox ${UPSTREAM_TAG} differs from pinned ${PINNED_VERSION}"
          existing="$(gh issue list --state open --label schema-drift --json number,title \
            --jq '.[] | select(.title | startswith("Schema drift")) | .number' | head -n1 || true)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$title" --label schema-drift --body-file /tmp/issue-body.md
          fi
