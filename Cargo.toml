[workspace]
members = [".", "xtask/codegen"]
default-members = [".", "xtask/codegen"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[package]
name = "nbx"
# nbx tracks the NetBox release it's generated from. Bump this in lockstep
# with `schema/netbox-*.json`, `schema/README.md`, and the `NETBOX_VERSION`
# default in `tests/integration/`. The output envelope's `nbxVersion` field
# is `env!("CARGO_PKG_VERSION")`, and `client::TARGET_NETBOX_VERSION` is
# derived from the same constant.
version = "4.5.10"
edition = "2024"
default-run = "nbx"
description = "A NetBox CLI for humans and AI agents. Single static binary, schema-driven typed flags, versioned JSON output envelope, agent skill files."
homepage = "https://github.com/Hebbian-Robotics/nbx"
repository = "https://github.com/Hebbian-Robotics/nbx"
documentation = "https://github.com/Hebbian-Robotics/nbx#readme"
readme = "README.md"
license = "Apache-2.0"
keywords = ["netbox", "cli", "dcim", "ipam", "agent"]
categories = ["command-line-utilities", "api-bindings", "network-programming"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
comfy-table = "7.2.2"
dirs = "6.0.0"
regress = "0.11.1"
reqwest = { version = "0.13.3", features = [
    "json",
    "query",
    "rustls",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "macros", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["serde"] }

[dev-dependencies]
insta = { version = "1.47.2", features = ["json", "yaml"] }
wiremock = "0.6.5"

# nbx has no [build-dependencies]: the published crate ships the
# already-generated source under src/generated/, and the drift checks that
# verify those files against the pinned schema live as workspace tests in
# the nbx-codegen crate (which is `publish = false` and only loaded in the
# dev workspace). This means a published `cargo install nbx` never needs
# nbx-codegen, typify, schemars, or any of the codegen toolchain.
