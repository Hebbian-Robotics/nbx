[package]
name = "nbx-codegen"
# Stays in lockstep with the parent nbx crate (which tracks NetBox).
version = "4.6.0"
edition = "2024"
description = "Internal codegen helpers for the nbx CLI. Not published to crates.io."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
indexmap = { version = "2.14.0", features = ["serde"] }
prettyplease = "0.2.37"
# Pinned to 0.8.x: typify 0.6 still consumes the schemars 0.8 schema
# types (`RootSchema`, `SchemaObject`). Bumping schemars to 1.x would break
# the type signatures we hand to `TypeSpace::add_root_schema`.
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = "2.0.117"
typify = "0.6.2"
